<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎫 관극 일정</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: sans-serif; background: white; padding: 15px; padding-bottom: 80px; }
h1 { margin: 10px 0; font-size: 22px; }
.card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 15px; padding: 16px; }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.calendar-header button { padding: 10px 16px; border: none; background: #ff6b6b; color: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
.calendar-header button:hover { background: #ff5252; }
.calendar-header h2 { margin: 0; flex: 1; text-align: center; font-size: 20px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.calendar-day-header { text-align: center; font-weight: bold; padding: 10px; color: #666; font-size: 12px; }
.calendar-day { min-height: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; transition: background .2s; }
.calendar-day:hover { background: #f9f9f9; }
.calendar-day.other-month { background: #fafafa; color: #999; }
.calendar-day.today { background: #fff3cd; border-color: #ffc107; }
.calendar-day.has-planned { border-color: #ff8c00; border-width: 2px; }
.calendar-day.has-watched { border-color: #4CAF50; border-width: 2px; }
.calendar-day.has-mixed { border: 2px solid #7e57c2; }
.day-number { font-weight: bold; margin-bottom: 4px; font-size: 14px; }
.day-events { font-size: 11px; color: #666; }
.event-indicator { display: inline-block; width: 6px; height: 6px; background: #ff6b6b; border-radius: 50%; margin-right: 4px; }
.event-indicator.planned { background: #ff8c00; }
.event-indicator.watched { background: #4CAF50; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; }
.modal.show { display: flex; }
.modal-content { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: white; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.2); padding: 20px; position: relative; }
.modal-content h3 { margin-top: 0; }
.close-btn { position: absolute; top: 14px; right: 14px; border: none; background: #ff6b6b; color: white; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.event-item { padding: 12px; background: #f6f7ff; border-left: 4px solid #4CAF50; margin-top: 12px; border-radius: 8px; font-size: 13px; }
.event-item.planned { background: #fff7e6; border-left-color: #ff8c00; }
.event-item.watched { background: #e8f7ed; border-left-color: #4CAF50; }
.event-title { font-weight: bold; }
.event-title.planned { color: #d35400; }
.event-title.watched { color: #2e7d32; }
.event-time { color: #666; font-size: 12px; }
.nav-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; height: 60px; background: white; border-top: 1px solid #ddd; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); z-index: 100; }
.nav-item { flex: 1; text-align: center; text-decoration: none; padding: 10px; font-size: 11px; color: #666; transition: background .2s; }
.nav-item.active { color: #ff6b6b; font-weight: bold; border-bottom: 3px solid #ff6b6b; }
.nav-item:hover { background: #fafafa; }
@media (max-width: 480px) { .calendar-day { min-height: 70px; padding: 6px; font-size: 12px; } .calendar-day-header { font-size: 11px; } }
</style>
</head>
<body>
<h1>🎫 관극 일정</h1>
<div class="card">
  <div class="calendar-header">
    <button onclick="prevMonth()">◀ 이전</button>
    <h2 id="monthYear"></h2>
    <button onclick="nextMonth()">다음 ▶</button>
  </div>
  <div class="calendar-grid" id="calendar"></div>
  <div id="monthSummary" class="card" style="margin-top:16px; padding:14px;">
    <div style="font-weight:bold; margin-bottom:8px;">이번달 관극 통계</div>
    <div id="musicalCount">뮤지컬: 0회</div>
    <div id="playCount">연극: 0회</div>
  </div>
</div>

<div id="eventModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeEventModal()">닫기</button>
    <div id="eventsList"></div>
  </div>
</div>

<div class="nav-bar">
  <span class="nav-item active">🎫 관극 일정</span>
  <a href="watch.html" class="nav-item">🎬 관극</a>
  <a href="entry.html" class="nav-item">🎭 도장판</a>
  <a href="actor.html" class="nav-item">👤 배우</a>
</div>

<script>
let currentDate = new Date();

function getWatchData() {
  return JSON.parse(localStorage.getItem('watchData')) || [];
}

function getEventsForDate(dateStr) {
  const watchData = getWatchData();
  return watchData.filter(entry => entry.date === dateStr);
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  
  document.getElementById('monthYear').textContent = `${year}년 ${month + 1}월`;
  updateMonthlyTypeCounts(year, month);
  
  const firstDay = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const prevLastDay = new Date(year, month, 0).getDate();
  
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';
  
  // 요일 헤더
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  days.forEach(day => {
    const header = document.createElement('div');
    header.className = 'calendar-day-header';
    header.textContent = day;
    calendar.appendChild(header);
  });
  
  // 이전달 날짜
  for (let i = firstDay - 1; i >= 0; i--) {
    const day = prevLastDay - i;
    const cell = createDayCell(year, month - 1, day, true);
    calendar.appendChild(cell);
  }
  
  // 현재달 날짜
  const today = new Date();
  for (let day = 1; day <= lastDay; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.className = 'calendar-day';
    
    const events = getEventsForDate(dateStr);
    const plannedEventsCount = events.filter(event => event.status === 'planned').length;
    const watchedEventsCount = events.filter(event => event.status !== 'planned').length;
    if (plannedEventsCount && watchedEventsCount) {
      cell.classList.add('has-mixed');
    } else if (plannedEventsCount) {
      cell.classList.add('has-planned');
    } else if (watchedEventsCount) {
      cell.classList.add('has-watched');
    }
    
    if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
      cell.classList.add('today');
    }
    
    cell.innerHTML = `<div class="day-number">${day}</div>`;
    
    if (events.length) {
      const indicatorClass = plannedEventsCount && !watchedEventsCount ? 'planned' : watchedEventsCount && !plannedEventsCount ? 'watched' : 'planned';
      cell.innerHTML += `<div class="day-events"><span class="event-indicator ${indicatorClass}"></span>${events.length}개</div>`;
    }
    
    cell.onclick = () => showEventsForDate(dateStr, events);
    calendar.appendChild(cell);
  }
  
  // 다음달 날짜
  const remainingCells = 42 - (firstDay + lastDay);
  for (let day = 1; day <= remainingCells; day++) {
    const cell = createDayCell(year, month + 1, day, true);
    calendar.appendChild(cell);
  }
}

function createDayCell(year, month, day, isOtherMonth) {
  const cell = document.createElement('div');
  cell.className = 'calendar-day';
  if (isOtherMonth) {
    cell.classList.add('other-month');
  } else {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const events = getEventsForDate(dateStr);
    if (events.length) {
      cell.classList.add('has-event');
    }
  }
  cell.innerHTML = `<div class="day-number">${day}</div>`;
  return cell;
}

function showEventsForDate(dateStr, events) {
  const eventsList = document.getElementById('eventsList');
  const eventModal = document.getElementById('eventModal');

  if (!events || events.length === 0) {
    eventModal.classList.remove('show');
    return;
  }

  const date = new Date(dateStr);
  const dateText = date.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  
  // 예정과 관극 분리
  const plannedEvents = events.filter(event => event.status === 'planned');
  const watchedEvents = events.filter(event => event.status !== 'planned');
  
  let html = `<h3>${dateText}의 관극 일정</h3>`;
  
  if (plannedEvents.length > 0) {
    html += `<h4 style="color:#d35400; margin-top:15px;">📅 예정된 관극</h4>`;
    html += plannedEvents.map(event => `
      <div class="event-item planned">
        <div class="event-title planned">${event.title} (예정)</div>
        <div><strong>종류:</strong> ${event.type}</div>
        <div><strong>캐스팅:</strong> ${event.casting || '미정'}</div>
        <div><strong>이벤트:</strong> ${event.event || '없음'}</div>
        ${event.time ? `<div><strong>시간:</strong> ${event.time}</div>` : ''}
        ${event.stampBoard ? `<div><strong>도장판:</strong> ${event.stampBoard}</div>` : ''}
        ${event.stampCount ? `<div><strong>예상 도장 갯수:</strong> ${event.stampCount}</div>` : ''}
        ${event.comment ? `<div><strong>코멘트:</strong> ${event.comment}</div>` : ''}
      </div>
    `).join('');
  }
  
  if (watchedEvents.length > 0) {
    html += `<h4 style="color:#2e7d32; margin-top:15px;">🎭 관극 기록</h4>`;
    html += watchedEvents.map(event => `
      <div class="event-item watched">
        <div class="event-title watched">${event.title}</div>
        <div><strong>종류:</strong> ${event.type}</div>
        <div><strong>캐스팅:</strong> ${event.casting || '없음'}</div>
        <div><strong>이벤트:</strong> ${event.event || '없음'}</div>
        ${event.time ? `<div><strong>시간:</strong> ${event.time}</div>` : ''}
        ${event.stampBoard ? `<div><strong>도장판:</strong> ${event.stampBoard}</div>` : ''}
        ${event.stampCount ? `<div><strong>도장 갯수:</strong> ${event.stampCount}</div>` : ''}
        ${event.comment ? `<div><strong>코멘트:</strong> ${event.comment}</div>` : ''}
      </div>
    `).join('');
  }
  
  eventsList.innerHTML = html;
  eventModal.classList.add('show');
}

function closeEventModal() {
  document.getElementById('eventModal').classList.remove('show');
}

function prevMonth() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
}

function updateMonthlyTypeCounts(year, month) {
  const watchData = getWatchData();
  const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
  const monthEntries = watchData.filter(entry =>
    entry.status !== 'planned' && entry.date && entry.date.startsWith(monthKey)
  );

  const musicalCount = monthEntries.filter(entry => entry.type === '뮤지컬').length;
  const playCount = monthEntries.filter(entry => entry.type === '연극').length;

  document.getElementById('musicalCount').textContent = `뮤지컬: ${musicalCount}회`;
  document.getElementById('playCount').textContent = `연극: ${playCount}회`;
}

(function init() {
  renderCalendar();
})();
</script>
</body>
</html>
